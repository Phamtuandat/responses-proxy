name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # better-sqlite3 is a native module; build tools are preinstalled on the
      # ubuntu runner, so `npm ci` compiles it from source without extra setup.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (server + client)
        run: npm run build

      - name: Test
        run: npm test
