name: proxy-deploy

on:
  workflow_run:
    workflows:
      - proxy-publish
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, omv]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to deploy directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /root/responses-proxy
          find /root/responses-proxy -mindepth 1 -maxdepth 1 \
            ! -name .env \
            ! -name logs \
            -exec rm -rf {} +
          tar --exclude=.git -cf - . | tar -C /root/responses-proxy -xf -

      - name: Deploy stack
        shell: bash
        run: |
          set -euo pipefail
          cd /root/responses-proxy
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          export RESPONSES_PROXY_IMAGE="ghcr.io/phamtuandat/responses-proxy:sha-${SHORT_SHA}"
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml pull responses-proxy telegram-bot telegram-bot-worker
          docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --no-build responses-proxy telegram-bot telegram-bot-worker